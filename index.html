<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Personal | compukelc</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <!-- Librería para crear PDFs en el cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- VISTA: LOGIN -->
    <div id="loginView" class="view-container active">
        <div class="card login-card">
            <h2 class="brand-title">compukelc</h2>
            <p>Sistema de Archivo Personal</p>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>
                <div class="input-group password-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button type="button" id="togglePassword" class="icon-btn">👁️</button>
                </div>
                <div class="remember-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Recordar usuario</label>
                </div>
                <button type="submit" class="btn primary-btn" id="loginBtn">Ingresar</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- VISTA: PANEL PRINCIPAL (SUBIDA) -->
    <div id="dashboardView" class="view-container hidden">
        <header class="app-header">
            <h2>Mi Archivo</h2>
            <div class="header-actions">
                <button id="btnDocumentos" class="btn secondary-btn">📚 Documentos</button>
                <button id="btnLogout" class="btn danger-btn">Cerrar Sesión</button>
            </div>
        </header>

        <div class="card upload-card">
            <h3>Subir Archivos</h3>
            
            <!-- NUEVO: Botones de Escaneo -->
            <div class="scanner-actions">
                <button class="btn scan-btn" id="btnScanMobile">📸 Escanear (Cámara/Móvil)</button>
                <button class="btn scan-btn" id="btnScanPC">🖨️ Escanear (PC)</button>
            </div>
            
            <!-- Inputs ocultos para cámara y archivos -->
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
            <input type="file" id="fileInput" multiple hidden>

            <div class="upload-zone" id="dropZone">
                <p>Arrastra tus archivos aquí o haz clic para seleccionar (Examinar)</p>
                <button class="btn secondary-btn" onclick="document.getElementById('fileInput').click()">Examinar Archivos</button>
            </div>
            
            <div id="fileList" class="file-list"></div>

            <div class="input-group form-folder">
                <label for="folderInput">Carpeta de destino:</label>
                <input type="text" id="folderInput" list="folderOptions" placeholder="Escribe o selecciona..." required>
                <datalist id="folderOptions"></datalist>
            </div>

            <button id="btnUpload" class="btn primary-btn" disabled>Subir a la nube</button>
            <div id="uploadStatus"></div>
        </div>
    </div>

    <!-- VISTA: DOCUMENTOS (REGISTROS) -->
    <div id="documentsView" class="view-container hidden">
        <header class="app-header">
            <h2>Control y Registro</h2>
            <button id="btnVolver" class="btn secondary-btn">⬅ Volver</button>
        </header>

        <div class="card filter-card">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar archivo o carpeta (Fuzzy search)...">
            </div>
            <div class="filters">
                <select id="filterYear"><option value="ALL">Todos los Años</option></select>
                <select id="filterMonth"><option value="ALL">Todos los Meses</option></select>
                <select id="filterDay"><option value="ALL">Todos los Días</option></select>
            </div>
        </div>

        <div class="table-container">
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Nombre</th>
                        <th>Carpeta</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
